<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Sundial icon concept B — sun, S shadow and gnomon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0D5B78"/>
      <stop offset="0.55" stop-color="#083A50"/>
      <stop offset="1" stop-color="#031A27"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.34" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.28" stop-color="#FFEBA8"/>
      <stop offset="0.62" stop-color="#FFD166"/>
      <stop offset="0.86" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#D98218"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A3D00" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A3D00" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sInk" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0A4B64"/>
      <stop offset="1" stop-color="#031A27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="sunClip"><circle cx="512" cy="512" r="296"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="440" fill="url(#glow)" filter="url(#blur)"/>

    <circle cx="512" cy="512" r="316" fill="#021723" opacity="0.45" filter="url(#soft)"/>
    <circle cx="512" cy="512" r="296" fill="url(#sun)"/>
    <circle cx="512" cy="512" r="296" fill="url(#shade)"/>
    <circle cx="512" cy="512" r="296" fill="none" stroke="#FFF6D8" stroke-opacity="0.75" stroke-width="5"/>
    <path d="M246 664 A296 296 0 0 0 778 664" fill="none" stroke="#FFFDF4" stroke-opacity="0.3" stroke-width="10"/>
    <ellipse cx="402" cy="356" rx="148" ry="82" fill="#FFFFFF" opacity="0.35" transform="rotate(-26 402 356)" filter="url(#soft)"/>

    <g clip-path="url(#sunClip)">
      <path d="M672 396 C672 292 390 292 390 404 C390 502 672 512 672 632 C672 748 390 748 390 652"
            fill="none" stroke="url(#sInk)" stroke-width="98" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M672 396 C672 292 390 292 390 404 C390 502 672 512 672 632 C672 748 390 748 390 652"
            fill="none" stroke="#02141F" stroke-width="98" stroke-linecap="round" stroke-linejoin="round" opacity="0.18" transform="translate(0 8)"/>
    </g>

    <path d="M512 512 L556 300 L588 512 Z" fill="#F4FEFF" opacity="0.92"/>
    <path d="M556 300 L588 512 L570 512 Z" fill="#0A4B64" opacity="0.4"/>
  </g>
</svg>
