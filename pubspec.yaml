name: sundial
description: "A local-first planner for life, work and home."
publish_to: 'none'
version: 0.9.0+9

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: 2.31.0
  sqlite3_flutter_libs: 0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.1
  file_picker: ^10.3.7
  cryptography: ^2.7.0
  basic_utils: ^5.8.2
  bonsoir: ^6.0.1
  crypto: ^3.0.7
  home_widget: ^0.10.0
  # pdf 3.11 needs archive <4.1; image 4.11 calls APIs missing from that archive.
  image: 4.8.0
  pdf: ^3.11.3
  sundial_core:
    path: packages/sundial_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: 2.31.0
  build_runner: 2.15.1
  sqlite3: 2.9.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    # Linux launcher sets are copied into the user's XDG data directory.
    - assets/icons/linux/hicolor/16x16/apps/
    - assets/icons/linux/hicolor/24x24/apps/
    - assets/icons/linux/hicolor/32x32/apps/
    - assets/icons/linux/hicolor/48x48/apps/
    - assets/icons/linux/hicolor/64x64/apps/
    - assets/icons/linux/hicolor/128x128/apps/
    - assets/icons/linux/hicolor/256x256/apps/
    - assets/icons/linux/hicolor/512x512/apps/
    - assets/sounds/
    - assets/sounds/aero/
    - assets/sounds/soft/
    - assets/fonts/OpenSans/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans/OpenSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/OpenSans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans/OpenSans-ExtraBold.ttf
          weight: 800
